pre-commit:
  parallel: false
  stage_fixed: true
  commands:
    format:
      priority: 1
      run: yarn -s prettier --ignore-unknown --log-level error --write {staged_files}
      fail_text: "❌ format failed"

    build:
      priority: 3
      run: yarn -s build
      fail_text: "❌ build failed"

commit-msg:
  commands:
    check-msg:
      run: yarn -s commitlint --edit {1} --quiet
      fail_text: "❌ commit message invalid"
