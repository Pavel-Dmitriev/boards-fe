pre-commit:
  parallel: false
  commands:
    format:
      priority: 1
      run: yarn prettier --ignore-unknown --log-level error {staged_files} && git add {staged_files}
      fail_text: '💅 Ошибка форматирования!'

    lint:
      priority: 2
      run: node ./lint-staged.mjs
      fail_text: '🚨 ESLint нашел ошибки в измененных файлах!'
      skip_after_fail: true

    build-check:
      priority: 3
      run: yarn build-check
      fail_text: '🛑 Ошибки сборки!'
      skip_after_fail: true

    update-index:
      priority: 4
      run: git update-index --again
      skip_if: git diff --cached --quiet
      skip_fail: true

commit-msg:
  commands:
    check-msg:
      run: yarn commitlint --edit {1}
      fail_text: '⛔ Неверный формат коммита!'
